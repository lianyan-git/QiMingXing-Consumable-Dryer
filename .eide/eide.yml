targets:
  APP:
    cppPreprocessAttrs:
      defineList:
        - STM32F10X_MD
        - USE_STDPERIPH_DRIVER
        - VECT_TAB_OFFSET=0x3400
      incList:
        - .
        - ../../app
        - ../../board
        - ../../bootloader
        - ../../bsp
        - ../../shared
        - ../../libraries/CMSIS/CM3/CoreSupport
